<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Google Calendar Agent</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <main>
      <h1>Google Calendar Agent</h1>

      <form id="signIn" class="card">
        <h2>Sign in</h2>
        <div class="row">
          <label>Username <input id="username" value="testuser" autocomplete="username" required /></label>
          <label> Password <input id="password" type="password" autocomplete="current-password" required /> </label>
        </div>
        <button>Get Token</button>
        <p id="signInStatus" class="status"></p>
      </form>

      <form id="chat" class="card">
        <h2>Chat</h2>
        <label> Message <input id="prompt" value="What's on my calendar?" required /> </label>
        <button id="send">Send</button>
        <div id="authLink" class="auth" hidden>
          <strong>Google needs your consent</strong>
          <p>Open the link and sign in with Google. The agent carries on once you've agreed.</p>
          <a target="_blank"></a>
        </div>
        <p id="answer" class="answer"></p>
      </form>
    </main>

    <script type="module">
      const config = await (await fetch('/api/config')).json()
      const sessionId = crypto.randomUUID()
      let token = ''

      const $ = (id) => document.getElementById(id)

      $('signIn').addEventListener('submit', async (event) => {
        event.preventDefault()
        const response = await fetch(`https://cognito-idp.${config.region}.amazonaws.com/`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/x-amz-json-1.1',
            'X-Amz-Target': 'AWSCognitoIdentityProviderService.InitiateAuth',
          },
          body: JSON.stringify({
            AuthFlow: 'USER_PASSWORD_AUTH',
            ClientId: config.clientId,
            AuthParameters: { USERNAME: $('username').value, PASSWORD: $('password').value },
          }),
        })
        const body = await response.json()
        token = body.AuthenticationResult?.AccessToken ?? ''
        localStorage.setItem('token', token)
        $('signInStatus').textContent = token ? `Signed in as ${$('username').value}` : body.message
        $('signInStatus').className = token ? 'status ok' : 'status error'
      })

      $('chat').addEventListener('submit', async (event) => {
        event.preventDefault()
        if (!token) {
          $('answer').textContent = 'Sign in first.'
          return
        }
        $('send').disabled = true
        $('answer').textContent = ''
        $('authLink').hidden = true

        try {
          const response = await fetch('/api/chat', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${token}` },
            body: JSON.stringify({ prompt: $('prompt').value, sessionId }),
          })
          if (!response.ok) {
            $('answer').textContent = `Error: ${(await response.json()).error}`
            return
          }

          const reader = response.body.pipeThrough(new TextDecoderStream()).getReader()
          let buffer = ''
          while (true) {
            const { done, value } = await reader.read()
            if (done) break
            buffer += value
            const lines = buffer.split('\n')
            buffer = lines.pop()
            for (const line of lines) {
              if (!line.startsWith('data: ')) continue
              const data = JSON.parse(line.slice(6))
              if (data.text) $('answer').textContent += data.text
              if (data.error) $('answer').textContent += `Error: ${data.error}`
              if (data.authUrl?.startsWith('https://')) {
                $('authLink').querySelector('a').href = data.authUrl
                $('authLink').querySelector('a').textContent = data.authUrl
                $('authLink').hidden = false
              }
            }
          }
        } catch (error) {
          $('answer').textContent = `Error: ${error.message}`
        } finally {
          $('send').disabled = false
        }
      })
    </script>
  </body>
</html>
