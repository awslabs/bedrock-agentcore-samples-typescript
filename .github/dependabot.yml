version: 2
updates:
  - package-ecosystem: npm
    directories:
      - /
      - /primitives/**
      - /use-cases/**
    # The AgentCore CLI generates and pins these CDK apps
    exclude-paths:
      - '**/agentcore/cdk'
      - '**/agentcore/cdk/**'
    ignore:
      # typescript-eslint supports TypeScript up to 6.0
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
      # The samples run on Node.js 22, so their Node types stay on 22
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
      # The live view's DCV UI, which ships inside bedrock-agentcore, needs @babel/runtime 7
      - dependency-name: '@babel/runtime'
        update-types: ['version-update:semver-major']
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      dependencies:
        patterns: ['*']
        group-by: dependency-name

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
