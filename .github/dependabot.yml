version: 2
updates:
  - package-ecosystem: npm
    directories:
      - /
      - /primitives/**
      - /use-cases/**
    # The AgentCore CLI generates and pins these CDK apps
    exclude-paths:
      - '**/agentcore/cdk'
      - '**/agentcore/cdk/**'
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      dependencies:
        patterns: ['*']
        group-by: dependency-name

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
