version: 1
applications:
  - appRoot: use-cases/digital-operations
    backend:
      phases:
        build:
          commands:
            - echo "Build environment is $CODEBUILD_BUILD_IMAGE"
            - which docker || true
            - n 20
            - hash -r
            - echo "Backend - Node.js version:" && node --version
            - echo "Backend - npm version:" && npm --version
            - echo "Setting up QEMU for ARM64 emulation..."
            - docker run --privileged --rm public.ecr.aws/eks-distro-build-tooling/binfmt-misc:qemu-v7.0.0 --install all
            - docker buildx create --use --name multiarch --driver docker-container || true
            - docker buildx inspect --bootstrap
            - echo "Multi-arch Docker support enabled"
            - npm ci --cache .npm --prefer-offline
            - npx ampx pipeline-deploy --branch $AWS_BRANCH --app-id $AWS_APP_ID
    frontend:
      phases:
        build:
          commands:
            - echo "Frontend - Node.js version:" && node --version
            - echo "Frontend - npm version:" && npm --version
            - npm run build
      artifacts:
        baseDirectory: .next
        files:
          - '**/*'
      cache:
        paths:
          - .next/cache/**/*
          - .npm/**/*
